[env:kc868a2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    colorize
board_build.filesystem = littlefs
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    ArduinoJson@7.4.3
    FS
    https://github.com/lan143/ed-mqtt#0.1.1
    https://github.com/lan143/ed-config#47def1f1fd8df21900aad6af71bf81c4321b1dee
    https://github.com/lan143/ed-utils#6fba146934d5a0d55896eed8a2a7f4c0ee6065b0
    https://github.com/lan143/ed-ha#f6ca848b4189e6ce48470d73eb603f14bfc0837f
    https://github.com/lan143/ed-healthcheck#e5fd3954732feb1a92e18348689e05c4696acc5f
    https://github.com/lan143/ed-wb#dfa808b1bf57e160d4bab5511fb439963e23364f
    https://github.com/lan143/ed-network#e6450b937e3cf24d06c4f720b00f246b10b01824
    https://github.com/lan143/ed-common#0.4.0
    https://github.com/GyverLibs/GyverFilters#3.2
build_flags=
    -Wshadow
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_COLORS=1

[env:kc868a2_ota]
extends = env:kc868a2
upload_protocol = espota
upload_port = 192.168.1.35
upload_flags = --auth=somestrongpassword 
